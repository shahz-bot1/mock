<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octave dot alignment — fix proposal</title>
<style>
:root { --bg:#101318; --panel:#171c24; --panel2:#1f2631; --text:#e8ecf2; --muted:#9aa4b2;
  --border:#2a323e; --accent:#5b9dff; --warn:#fbbf24; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"SF Pro Text",sans-serif; padding:16px; }
h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:0 0 10px; }
p { color:var(--muted); font-size:14px; line-height:1.5; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
.strip { display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }
.fchip { background:var(--panel2); border:1.5px solid var(--accent); border-radius:12px;
  padding:10px 12px; font-size:16px; font-weight:700; min-width:56px; text-align:center; }
.fchip .dur { display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:2px; }
.fchip sub { font-size:10px; color:var(--muted); }

/* NOW: shipped design — letter+subscript inside one inline-flex column, dot centers over both */
.NOW .st { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; }
.NOW .st::before { content:""; display:block; height:9px; font-size:11px; line-height:9px; color:var(--accent); }
.NOW .st::after { content:""; display:block; height:9px; font-size:13px; line-height:9px; color:var(--accent); }
.NOW .st.oct-up::before { content:"˙"; }
.NOW .st.oct-dn::after { content:"."; }

/* FIX: letter alone in the dot column; subscript trails outside it */
.FIX .st { display:inline-block; vertical-align:middle; line-height:1.05; }
.FIX .lt { display:inline-flex; flex-direction:column; align-items:center; line-height:1.05; }
.FIX .lt::before { content:""; display:block; height:9px; font-size:11px; line-height:9px; color:var(--accent); }
.FIX .lt::after { content:""; display:block; height:9px; font-size:13px; line-height:9px; color:var(--accent); }
.FIX .lt.oct-up::before { content:"˙"; }
.FIX .lt.oct-dn::after { content:"."; }
</style>
</head>
<body>
<p>Same chips in both cards: a low R1 / middle G2 / low D1 stack, an upper N3 R1 pair, a held S,
and a long stack with a low R1 inside. Watch where the dot sits relative to the letter vs the small digit.</p>

<div class="card"><h2>Now — dot centers over letter+digit</h2><div class="strip NOW" id="now"></div></div>
<div class="card"><h2>Fix — dot centers on the letter only</h2><div class="strip FIX" id="fix"></div></div>

<script>
/* notes: [letter, variant|null, oct]  oct: -1 low, 0 mid, 1 up; "hold" = comma */
const CHIPS = [
  { notes: [["R",1,-1],["G",2,0],["D",1,-1]], dur: "1 beat" },
  { notes: [["N",3,1],["R",1,1],["N",3,1],["R",1,1]], dur: "1 beat" },
  { notes: [["S",null,0],"hold","hold","hold"], dur: "1 beat" },
  { notes: [["S",null,0],["R",1,0],["G",2,0],["R",1,-1],["G",2,0],"hold","hold","hold"], dur: "2 beats" },
  { notes: [["D",1,1],"hold",["M",2,0],["G",2,0]], dur: "1 beat" },
];
const octCls = o => o > 0 ? " oct-up" : o < 0 ? " oct-dn" : "";
const nowHTML = CHIPS.map(c => {
  const label = c.notes.map(n => n === "hold"
    ? '<span class="st">,</span>'
    : `<span class="st${octCls(n[2])}">${n[0]}${n[1] ? `<sub>${n[1]}</sub>` : ""}</span>`).join("");
  return `<div class="fchip">${label}<span class="dur">${c.dur}</span></div>`;
}).join("");
const fixHTML = CHIPS.map(c => {
  const label = c.notes.map(n => n === "hold"
    ? '<span class="st"><span class="lt">,</span></span>'
    : `<span class="st"><span class="lt${octCls(n[2])}">${n[0]}</span>${n[1] ? `<sub>${n[1]}</sub>` : ""}</span>`).join("");
  return `<div class="fchip">${label}<span class="dur">${c.dur}</span></div>`;
}).join("");
document.getElementById("now").innerHTML = nowHTML;
document.getElementById("fix").innerHTML = fixHTML;
</script>
</body>
</html>
