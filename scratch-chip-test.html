<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octave-dot chips — proposal</title>
<style>
:root { --bg:#101318; --panel:#171c24; --panel2:#1f2631; --text:#e8ecf2; --muted:#9aa4b2;
  --border:#2a323e; --accent:#5b9dff; --warn:#fbbf24; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"SF Pro Text",sans-serif; padding:16px; }
h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:0 0 10px; }
p { color:var(--muted); font-size:14px; line-height:1.5; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
.strip { display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }
.fchip { background:var(--panel2); border:1.5px solid var(--accent); border-radius:12px;
  padding:10px 12px; font-size:16px; font-weight:700; min-width:56px; text-align:center; }
.fchip.gapc, .fchip.holdc { border-color:var(--border); color:var(--muted); }
.fchip .dur { display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:2px; }
.fchip sub { font-size:10px; color:var(--muted); }

/* DOT proposal: each swara is an inline-flex column [top dot slot][letter][bottom dot slot];
   slots always reserved so letters share one baseline */
.DOT .st { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; }
.DOT .st::before { content:""; display:block; height:9px; font-size:11px; line-height:9px; color:var(--accent); }
.DOT .st::after { content:""; display:block; height:9px; font-size:13px; line-height:9px; color:var(--accent); }
.DOT .st.oct-up::before { content:"˙"; }
.DOT .st.oct-dn::after { content:"."; }
</style>
</head>
<body>
<p>Same chips in both cards — a low R1 with holds, an all-upper N3 R1 run, a held S, a gap, and a
long stack with a low note inside. Top card = current live design (no dots). Bottom = proposal.</p>

<div class="card"><h2>Now — no octave dots</h2><div class="strip" id="now"></div></div>
<div class="card"><h2>Proposal — dots, same compact design</h2><div class="strip DOT" id="dot"></div></div>

<script>
const CHIPS = [
  '<span class="st oct-dn">R<sub>1</sub></span><span class="st">,</span><span class="st">N<sub>3</sub></span><span class="st">D<sub>1</sub></span>|1 beat|',
  '<span class="st oct-up">N<sub>3</sub></span><span class="st oct-up">R<sub>1</sub></span><span class="st oct-up">N<sub>3</sub></span><span class="st oct-up">R<sub>1</sub></span>|1 beat|',
  '<span class="st">S</span><span class="st">,</span><span class="st">,</span><span class="st">,</span>|1 beat|',
  '<span>–</span>|¼ beat|gapc',
  '<span class="st">S</span><span class="st">R<sub>1</sub></span><span class="st">G<sub>2</sub></span><span class="st oct-dn">R<sub>1</sub></span><span class="st">G<sub>2</sub></span><span class="st">,</span><span class="st">,</span><span class="st">,</span>|2 beats|',
  '<span class="st oct-up">D<sub>1</sub></span><span class="st">,</span><span class="st">,</span><span class="st">,</span>|1 beat|',
];
const html = CHIPS.map(c => {
  const [label, dur, cls] = c.split("|");
  return `<div class="fchip ${cls || ""}">${label}<span class="dur">${dur}</span></div>`;
}).join("");
document.getElementById("now").innerHTML = html;
document.getElementById("dot").innerHTML = html;
</script>
</body>
</html>
