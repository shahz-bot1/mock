<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Studios</title>
<style>
:root, [data-theme="dark"] {
  --bg: #101318; --panel: #171c24; --panel2: #1f2631;
  --text: #e8ecf2; --muted: #9aa4b2; --border: #2a323e;
  --accent: #5b9dff; --accent-soft: rgba(91,157,255,.16);
}
[data-theme="light"] {
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5;
  --text: #1b2330; --muted: #5d6b7d; --border: #dde3ea;
  --accent: #2f6fe4; --accent-soft: rgba(47,111,228,.12);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "SF Pro Text", sans-serif; padding: 12px; }
header { margin: 4px 2px 14px; }
header h1 { margin: 0; font-size: 22px; }
header h1 span { color: var(--accent); }
header p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px; margin-bottom: 12px; }
a.studio { display: flex; align-items: center; gap: 12px; padding: 13px 4px;
  text-decoration: none; color: inherit; border-bottom: 1px solid var(--border); }
a.studio:last-child { border-bottom: 0; }
a.studio .n { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft);
  color: var(--accent); font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex: none; }
a.studio .t { flex: 1; }
a.studio .t b { display: block; font-size: 15px; }
a.studio .t small { color: var(--muted); font-size: 12px; }
a.studio .chev { color: var(--muted); font-size: 20px; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>Mock <span>Studios</span></h1>
  <p>Scratch prototypes — iterate freely, integrate when refined</p>
</header>
<section class="card">
  <a class="studio" href="swara-builder/">
    <div class="n">2</div>
    <div class="t"><b>Swara Builder Playground</b><small>4 prototypes for loop swara capture · Adi tala</small></div>
    <div class="chev">›</div>
  </a>
  <a class="studio" href="varisai/">
    <div class="n">1</div>
    <div class="t"><b>Varisai Studio</b><small>Structured Carnatic practice exercises · v1</small></div>
    <div class="chev">›</div>
  </a>
</section>
<p class="foot">shahz-bot1/mock · scratch repo</p>
<script>
try {
  const th = localStorage.getItem("varisai-theme");
  if (th) document.documentElement.dataset.theme = th;
} catch (e) {}
</script>
</body>
</html>
