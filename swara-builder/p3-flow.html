<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 · Flow Strip — Swara Builder</title>
<link rel="stylesheet" href="core.css?v=2026.10.13-1">
</head>
<body>
<header class="top">
  <a class="back" href="index.html">‹ Playground</a>
  <h1>P3 · Flow Strip<small>no grid — append swaras, each chip owns its duration</small></h1>
  <span id="themeSlot"></span>
</header>

<div class="card">
  <h2>Setup</h2>
  <div class="controls">
    <label class="f">Raga<span id="ragaSlot"></span></label>
    <label class="f">Sa<span id="saSlot"></span></label>
    <label class="f">Beat <span><input type="range" id="tempo" min="30" max="120"> <b id="tempoV"></b> bpm</span></label>
  </div>
  <div class="controls" style="margin-top:10px">
    <button class="btn" id="playBtn">▶ Play</button>
    <button class="btn ghost" id="addBtn">＋ Append swara</button>
    <button class="btn ghost" id="addGap">＋ Gap</button>
    <button class="btn ghost" id="addHold">＋ Hold ,</button>
    <button class="btn danger" id="clearBtn">Clear</button>
    <button class="btn ghost" id="exportBtn">Export</button>
  </div>
  <p class="note">Tap a chip to edit it: cycle its duration (¼ → ½ → 1 → 2 → 4 beats), stack more swaras,
  move or delete. Total beats: <b id="totBeats">0</b>. This is the free-time answer to P1's grid —
  nothing is forced into 8.</p>
</div>

<div class="card">
  <h2>Phrase</h2>
  <div class="strip" id="strip"></div>
</div>

<script src="core.js?v=2026.10.13-1"></script>
<script>
"use strict";
SB.applyTheme("sb-theme");
document.getElementById("themeSlot").appendChild(SB.themeBtn("sb-theme"));

const store = {
  data: SB.load("sb-p3", null) || { ragaId:"mohanam", saOffset:0, tempo:60, chips:[] },
  save() { SB.save("sb-p3", this.data); }
};
const d = () => store.data;
const DURS = [0.25, 0.5, 1, 2, 4];
const durLabel = b => b === 1 ? "1 beat" : b === 0.5 ? "½ beat" : b === 0.25 ? "¼ beat" : b + " beats";

document.getElementById("ragaSlot").appendChild(SB.ragaSelect(d().ragaId, v => { d().ragaId = v; store.save(); }));
document.getElementById("saSlot").appendChild(SB.saSelect(d().saOffset, v => { d().saOffset = v; store.save(); restartIfPlaying(); }));
const tempoEl = document.getElementById("tempo"), tempoV = document.getElementById("tempoV");
tempoEl.value = d().tempo;
const paintTempo = () => tempoV.textContent = tempoEl.value;
paintTempo();
tempoEl.oninput = () => { d().tempo = +tempoEl.value; paintTempo(); store.save(); restartIfPlaying(); };

function render() {
  const host = document.getElementById("strip");
  host.innerHTML = "";
  let tot = 0;
  d().chips.forEach((c, i) => {
    tot += c.beats;
    const el = document.createElement("div");
    el.className = "fchip" + (c.k === "gap" ? " gapc" : c.k === "hold" ? " holdc" : "");
    el.innerHTML = (c.k === "note" ? SB.slotLabelHTML({ k:"note", stack:c.stack })
                    : c.k === "hold" ? "," : "–") +
      `<span class="dur">${durLabel(c.beats)}</span>`;
    el.onclick = () => onChipTap(i);
    host.appendChild(el);
  });
  document.getElementById("totBeats").textContent = tot;
  const add = document.createElement("div");
  add.className = "fchip addc";
  add.textContent = "＋";
  add.onclick = () => onChipTap(-1);
  host.appendChild(add);
  const foots = document.querySelectorAll(".foot");
  foots.forEach((f, i) => { if (i < foots.length - 1) f.remove(); });
  document.body.appendChild(SB.footer());
}

function addChip(chip) { stop(); d().chips.push(chip); store.save(); render(); }
function chipLabel(c) {
  return c.k === "note" ? SB.slotLabelHTML({ k:"note", stack:c.stack })
    : c.k === "hold" ? "," : "–";
}
function pickNewChip(title, done) {
  let beats = 1;
  SB.openPicker({ title, ragaId:d().ragaId, stackMode:true,
    duration:{ value:beats, options:DURS },
    onDuration: v => { beats = v; },
    onPick: p => {
      if (p.kind === "swara") done({ k:"note", stack:[{ st:p.st, oct:p.oct }], beats });
      else if (p.kind === "hold") done({ k:"hold", beats });
      else if (p.kind === "gap") done({ k:"gap", beats });
      else if (p.kind === "stack") done({ k:"note", stack:p.stack, beats });
    }});
}
function onChipTap(i) {
  if (i < 0) {
    pickNewChip("Append swara", chip => addChip(chip));
    return;
  }
  const c = d().chips[i];
  SB.openPicker({ title:`Edit chip #${i + 1}`, ragaId:d().ragaId, stackMode:true,
    insert: true,
    onInsert: where => {
      const at = where === "before" ? i : i + 1;
      pickNewChip(`Insert ${where} chip #${i + 1}`, chip => {
        stop(); d().chips.splice(at, 0, chip); store.save(); render();
      });
    },
    current:`Now: ${chipLabel(c)}`,
    prefill: c.k === "note" ? c.stack : c.k === "hold" ? [{ hold:true }] : null,
    stackOn: c.k === "note" && c.stack.length > 1,
    duration:{ value:c.beats, options:DURS },
    onDuration: v => { d().chips[i].beats = v; store.save(); render(); },
    onPick: p => {
      if (p.kind === "swara") d().chips[i] = { k:"note", stack:[{ st:p.st, oct:p.oct }], beats:c.beats };
      else if (p.kind === "hold") d().chips[i] = { k:"hold", beats:c.beats };
      else if (p.kind === "gap") d().chips[i] = { k:"gap", beats:c.beats };
      else if (p.kind === "clear") d().chips.splice(i, 1);
      else if (p.kind === "stack") d().chips[i] = { k:"note", stack:p.stack, beats:c.beats };
      else return;
      store.save(); render();
    }});
}
document.getElementById("addBtn").onclick = () => onChipTap(-1);
document.getElementById("addGap").onclick = () => addChip({ k:"gap", beats:1 });
document.getElementById("addHold").onclick = () => addChip({ k:"hold", beats:1 });
document.getElementById("clearBtn").onclick = () => {
  if (!confirm("Clear phrase?")) return;
  stop(); d().chips = []; store.save(); render();
};
document.getElementById("exportBtn").onclick = () => {
  const payload = {
    app: "Compose Studio", version: 1, kind: "composition",
    composition: {
      name: "Flow Strip phrase",
      ragaId: d().ragaId, saOffset: d().saOffset, tempo: d().tempo,
      chips: d().chips,
    },
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "flow-strip-phrase.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

/* ---------- playback (variable durations) ---------- */
const playBtn = document.getElementById("playBtn");
let playing = false, timers = [];
function stop() {
  playing = false;
  timers.forEach(clearTimeout); timers = [];
  SB.stopAll();
  playBtn.textContent = "▶ Play"; playBtn.classList.remove("playing");
  document.querySelectorAll(".fchip.cur").forEach(x => x.classList.remove("cur"));
}
function restartIfPlaying() { if (playing) { stop(); playBtn.onclick(); } }
playBtn.onclick = async () => {
  if (playing) { stop(); return; }
  if (!d().chips.length) return;
  SB.ensureAudio();
  try { await SB.ensureSamples("samples/harmonium/"); } catch (e) {}
  playing = true;
  playBtn.textContent = "⏹ Stop"; playBtn.classList.add("playing");
  const beat = 60 / d().tempo, t0 = SB.ensureAudio().currentTime + 0.1;
  const chips = [...document.querySelectorAll(".fchip")];
  // expand: holds extend previous sounding chip
  const evs = [];
  let pending = null;
  const flush = () => { if (pending) { evs.push(pending); pending = null; } };
  let t = t0, idx = 0;
  d().chips.forEach(c => {
    const ct = t, cref = c;
    timers.push(setTimeout(() => {
      if (!playing) return;
      chips.forEach(x => x.classList.remove("cur"));
      const ci = d().chips.indexOf(cref);
      if (chips[ci]) chips[ci].classList.add("cur");
    }, Math.max(0, (ct - t0) * 1000)));
    if (c.k === "hold") { if (pending) pending.dur += c.beats * beat; t += c.beats * beat; return; }
    if (c.k === "note" && (c.stack || []).length && c.stack.every(n => n.hold)) {
      if (pending) pending.dur += c.beats * beat; t += c.beats * beat; idx++; return;
    }
    flush();
    if (c.k === "note") pending = { chip:c, idx, t, dur:c.beats * beat };
    t += c.beats * beat; idx++;
  });
  flush();
  evs.forEach(ev => {
    const stack = ev.chip.stack || [];
    const n = stack.length;
    if (!n) return;
    // a hold inside the stack extends the preceding sub-note
    const units = [];
    stack.forEach(sn => {
      if (sn.hold) { if (units.length) units[units.length - 1].shares += 1; }
      else units.push({ note: sn, shares: 1 });
    });
    if (!units.length) return;
    const ownDur = ev.chip.beats * beat; // stack subdivides its OWN chip duration
    const sub = ownDur / n;
    const extra = ev.dur - ownDur; // outer holds extend the final sub-note only
    let st = ev.t;
    units.forEach((u, ui) => {
      let ud = u.shares * sub;
      if (ui === units.length - 1) ud += extra;
      SB.playNote(st, u.note.st, u.note.oct, d().saOffset, ud + Math.min(0.28, ud * 0.7));
      st += ud;
    });
  });
  timers.push(setTimeout(() => stop(), (t - t0) * 1000 + 400));
};

render();
</script>
</body>
</html>
